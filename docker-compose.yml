# Server Spoje UK + Caddy (automatické HTTPS). Spuštění: docker compose up -d --build
services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8080"
      POLL_MODE: loop        # na vlastním serveru dotazy na zdroje běží stále
    expose:
      - "8080"
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [web]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Nastav DOMAIN v souboru .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
volumes:
  caddy_data:
